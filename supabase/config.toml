# Supabase CLI configuration for Athlete OS.
# project_id is a local placeholder; link the real project with
# `supabase link --project-ref <ref>` (the ref is not stored in the repo).
project_id = "athlete-os"

# AI coach proxy. JWT verification is enforced by the gateway and again inside
# the function (auth.getUser) so only signed-in users can reach providers.
[functions.ai-chat]
verify_jwt = true

[functions.ai-status]
verify_jwt = true

[functions.strava-oauth]
verify_jwt = true

# Auth settings applied to the hosted project via the Management API
# (PATCH /v1/projects/{ref}/config/auth, see docs/BACKEND_DEPLOY.md) and
# mirrored here for `supabase start`. We deliberately do NOT use
# `supabase config push` against production: it would also push every
# unspecified [auth] default.
[auth]
site_url = "athleteos://localhost/auth"
additional_redirect_urls = ["athleteos://localhost/**"]
enable_anonymous_sign_ins = true
enable_signup = true

[auth.email]
enable_signup = true
otp_length = 6
otp_expiry = 600
