name: athlete_os
description: "Athlete OS - personal fitness, health and self-improvement OS"
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.13.7

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.1
  drift: ^2.35.3
  drift_flutter: ^0.3.1
  # Per-connection PRAGMAs (WAL, busy_timeout) in AppDatabase.
  sqlite3: ^3.8.0
  path_provider: ^2.1.6
  path: ^1.9.1
  flutter_local_notifications: ^22.3.3
  timezone: ^0.11.2
  flutter_timezone: ^5.1.1
  flutter_secure_storage: ^11.2.0
  fl_chart: ^1.3.0
  health: ^13.3.2
  google_sign_in: ^7.2.0
  googleapis: ^17.0.0
  extension_google_sign_in_as_googleapis_auth: ^3.0.0
  http: ^1.6.0
  uuid: ^4.6.0
  intl: ^0.20.3
  mobile_scanner: ^7.4.2
  url_launcher: ^6.3.3
  flutter_web_auth_2: ^5.1.0
  supabase_flutter: ^2.18.3
  share_plus: ^13.3.1
  image_picker: ^1.2.4
  # Label photos: downscale + re-encode to a <=1 MB JPEG before AI upload.
  image: ^4.5.0
  collection: ^1.19.1
  # Voice (docs/VOICE.md): on-device speech recognition + Android TTS.
  speech_to_text: 7.5.0
  flutter_tts: 4.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.2
  build_runner: ^2.17.1
  mocktail: ^1.0.5
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  uses-material-design: true

  # Fragment shaders (see lib/core/widgets/hud_background.dart, orb.dart).
  shaders:
    - shaders/hud_background.frag
    - shaders/arc_reactor.frag

  assets:
    - assets/fonts/OFL.txt
    # User-supplied Indian dish nutrition (per 100 g), see docs/integrations/food-data.md
    - assets/data/indian_food_nutrition.csv

  # Bundled, OFL-licensed (assets/fonts/OFL.txt; registered with
  # LicenseRegistry in lib/app/app.dart). Static instances subset to Latin.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    - family: InterDisplay
      fonts:
        - asset: assets/fonts/InterDisplay-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/InterDisplay-Bold.ttf
          weight: 700
        - asset: assets/fonts/InterDisplay-ExtraBold.ttf
          weight: 800
    - family: Rajdhani
      fonts:
        - asset: assets/fonts/Rajdhani-Medium.ttf
          weight: 500
        - asset: assets/fonts/Rajdhani-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Rajdhani-Bold.ttf
          weight: 700
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/JetBrainsMono-SemiBold.ttf
          weight: 600

# Launcher icons: regenerate with
#   flutter test tool/render_icon_test.dart && dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon/icon.png
  adaptive_icon_background: assets/icon/icon_background.png
  adaptive_icon_foreground: assets/icon/icon_foreground.png
  adaptive_icon_monochrome: assets/icon/icon_monochrome.png
  min_sdk_android: 21

# Native splash: regenerate with  dart run flutter_native_splash:create
flutter_native_splash:
  color: "#04060B"
  image: assets/icon/splash.png
  android_12:
    color: "#04060B"
    image: assets/icon/splash_android12.png
    icon_background_color: "#04060B"
  fullscreen: false
  web: false
  ios: false
